name: astrbot_plugin_at_resolve
display_name: QQ群at映射解析
short_desc: 把 qq_official 群聊 <@HEX> 提及改写为 @名字，并统一 @ 与群聊上下文的发言人名字空间
desc: QQ群at映射解析：自动学习 member_openid→QQ昵称/群名片 双字段映射，把 <@HEX> 改写为 @名字（群名片优先可配，默认开启并同步统一群聊上下文发言人标签），让 AI 认得谁 at 了谁、不把同一人误认成两个。WebUI 管理页面（QQ群at映射管理）或 /atmap 指令均可管理，按群持久化、可整群删除
help: '在 WebUI → 插件管理 → 本插件 → 「QQ群at映射管理」页面维护映射（查看/改昵称与群名片/删单条/删除整群）；或用指令（管理员） /atmap list|show|del|set|setcard|deluser|reload。数据在 data/plugin_data/astrbot_plugin_at_resolve/groups/ 按群一个 JSON。'
